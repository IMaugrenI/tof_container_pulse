refresh_seconds: 60
cpu_warn_percent: 50
memory_warn_mb: 1024
docker_timeout_seconds: 8

# Hardware Pulse basic thresholds
# These checks are read-only and intentionally lightweight.
hardware_cpu_warn_percent: 70
hardware_cpu_critical_percent: 90
hardware_memory_warn_percent: 80
hardware_memory_critical_percent: 90
hardware_swap_warn_percent: 30
hardware_swap_critical_percent: 60
hardware_disk_warn_percent: 80
hardware_disk_critical_percent: 90
hardware_inode_warn_percent: 80
hardware_inode_critical_percent: 90
hardware_uptime_warn_days: 30
hardware_uptime_critical_days: 60

# Hardware Pulse generic sensor collection
# Default sensor sources are cheap local Linux sysfs paths when available:
# - /sys/class/hwmon
# - /sys/class/thermal
# Missing sensors are treated as unavailable, not as failures.
hardware_enable_sensors: true
hardware_sensor_max_rows: 32
hardware_temperature_warn_celsius: 75
hardware_temperature_critical_celsius: 90
hardware_fan_min_warn_rpm: 400
hardware_fan_min_critical_rpm: 100

# Many laptops intentionally stop fans at low temperature.
# Keep false unless your host should treat 0 RPM as a hard failure.
hardware_fan_zero_is_critical: false

# Optional external GPU tooling.
# Disabled by default to keep the normal path dependency-light.
# When enabled, Hardware Pulse may use nvidia-smi if it exists.
hardware_enable_gpu_tools: false
hardware_sensor_command_timeout_seconds: 1.5
hardware_vram_warn_percent: 80
hardware_vram_critical_percent: 95

# Port Pulse local inspection
# Port Pulse uses local read-only tools such as ss or netstat.
# It does not run external scans and does not change firewall rules.
# Plain-language service hints are best-effort labels for humans, not proof.
port_command_timeout_seconds: 2

# Optional Port Pulse allowlist.
# Matching entries are shown as OK/allowed.
# Use this for listeners that are expected on your host.
# Empty by default because every machine is different.
port_allowed_listeners: []
# port_allowed_listeners:
#   - protocol: tcp
#     bind: 127.0.0.1
#     port: 8080
#   - protocol: tcp
#     exposure: private-lan
#     port: 22

# Storage Pulse local inspection
# Storage Pulse reads local mount usage and inode usage.
# It does not delete files, run cleanup, repair disks, or change mounts.
# Virtual desktop helper mounts like /run/user/*/doc and /run/user/*/gvfs
# are hidden from the normal overview because they are not real storage targets.
# Filesystems without normal Linux inode reporting, such as vfat/EFI, show
# inode values as N/A instead of creating an UNKNOWN storage warning.
# The optional disk overview uses read-only lsblk output and intentionally does
# not show serial numbers, UUIDs, WWN, or model names to keep screenshots safer.
storage_disk_warn_percent: 80
storage_disk_critical_percent: 90
storage_inode_warn_percent: 80
storage_inode_critical_percent: 90
storage_max_mounts: 24
storage_include_tmpfs: false

# Services Pulse explicit checks
# Services Pulse does not guess important services and does not scan.
# You explicitly define what should be checked.
# It does not restart, stop, modify, or repair services.
service_check_timeout_seconds: 2
service_allow_external_urls: false
service_checks: []
# service_checks:
#   - name: Local web app
#     type: url
#     url: http://127.0.0.1:8080/health
#     expected_status: 200
#   - name: Local API TCP
#     type: tcp
#     host: 127.0.0.1
#     port: 8000
#   - name: Bot heartbeat
#     type: heartbeat
#     path: /tmp/my_bot.heartbeat
#     max_age_seconds: 300
#
# External URL checks are disabled by default to avoid surprise network calls.
# To intentionally check an outside URL, set allow_external: true on that check.
#   - name: Public status endpoint
#     type: url
#     url: https://example.com/health
#     expected_status: 200
#     allow_external: true

# optional multi-host setup
# leave hosts unset or empty to keep the normal single-host behavior
# hosts:
#   - name: local
#     docker_context: default

container_overrides:
  postgres:
    memory_warn_mb: 2048
  redis:
    memory_warn_mb: 512
  my_busy_worker:
    cpu_warn_percent: 70
