refresh_seconds: 60
cpu_warn_percent: 50
memory_warn_mb: 1024
docker_timeout_seconds: 8

# Cross-platform support
# Pulse Suite now uses platform wrappers for Hardware, Ports, Storage, and Security.
# Linux keeps the deep collectors that already exist.
# macOS and Windows use calm read-only baseline adapters.
# Optional psutil improves Hardware and Storage data on macOS/Windows when installed,
# but the suite does not require it.
# Unsupported platform details are shown as optional, unknown, or N/A instead of crashing.

# Hardware Pulse basic thresholds
# These checks are read-only and intentionally lightweight.
hardware_cpu_warn_percent: 70
hardware_cpu_critical_percent: 90
hardware_memory_warn_percent: 80
hardware_memory_critical_percent: 90
hardware_swap_warn_percent: 30
hardware_swap_critical_percent: 60
hardware_disk_warn_percent: 80
hardware_disk_critical_percent: 90
hardware_inode_warn_percent: 80
hardware_inode_critical_percent: 90
hardware_uptime_warn_days: 30
hardware_uptime_critical_days: 60

# Hardware Pulse generic sensor collection
# Linux deep sensors use cheap sysfs paths when available:
# - /sys/class/hwmon
# - /sys/class/thermal
# macOS/Windows currently show safe baseline host signals unless optional
# adapters are added later. Missing sensors are treated as unavailable, not as failures.
hardware_enable_sensors: true
hardware_sensor_max_rows: 32
hardware_temperature_warn_celsius: 75
hardware_temperature_critical_celsius: 90
hardware_fan_min_warn_rpm: 400
hardware_fan_min_critical_rpm: 100

# Many laptops intentionally stop fans at low temperature.
# Keep false unless your host should treat 0 RPM as a hard failure.
hardware_fan_zero_is_critical: false

# Optional external GPU tooling.
# Disabled by default to keep the normal path dependency-light.
# When enabled, Hardware Pulse may use nvidia-smi if it exists.
hardware_enable_gpu_tools: false
hardware_sensor_command_timeout_seconds: 1.5
hardware_vram_warn_percent: 80
hardware_vram_critical_percent: 95

# Port Pulse local inspection
# Linux uses ss or netstat.
# macOS uses netstat.
# Windows uses PowerShell Get-NetTCPConnection first, then netstat fallback.
# Port Pulse does not run external scans and does not change firewall rules.
# Plain-language service hints are best-effort labels for humans, not proof.
port_command_timeout_seconds: 2

# Optional Port Pulse allowlist.
# Matching entries are shown as OK/allowed on Linux deep collector.
# Use this for listeners that are expected on your host.
# Empty by default because every machine is different.
port_allowed_listeners: []
# port_allowed_listeners:
#   - protocol: tcp
#     bind: 127.0.0.1
#     port: 8080
#   - protocol: tcp
#     exposure: private-lan
#     port: 22

# Storage Pulse local inspection
# Linux uses mount/inode details and optional lsblk disk overview.
# macOS and Windows use baseline volume usage. Inode details may show N/A.
# Storage Pulse does not delete files, run cleanup, repair disks, or change mounts.
# Virtual desktop helper mounts like /run/user/*/doc and /run/user/*/gvfs
# are hidden from the normal Linux overview because they are not real storage targets.
# Filesystems without normal Linux inode reporting, such as vfat/EFI, show
# inode values as N/A instead of creating an UNKNOWN storage warning.
# The optional Linux disk overview uses read-only lsblk output and intentionally does
# not show serial numbers, UUIDs, WWN, or model names to keep screenshots safer.
storage_disk_warn_percent: 80
storage_disk_critical_percent: 90
storage_inode_warn_percent: 80
storage_inode_critical_percent: 90
storage_max_mounts: 24
storage_include_tmpfs: false

# Services Pulse explicit checks
# Services Pulse is cross-platform by design.
# It does not guess important services and does not scan.
# You explicitly define what should be checked.
# It does not restart, stop, modify, or repair services.
service_check_timeout_seconds: 2
service_allow_external_urls: false
service_checks: []
# service_checks:
#   - name: Local web app
#     type: url
#     url: http://127.0.0.1:8080/health
#     expected_status: 200
#   - name: Local API TCP
#     type: tcp
#     host: 127.0.0.1
#     port: 8000
#   - name: Bot heartbeat
#     type: heartbeat
#     path: /tmp/my_bot.heartbeat
#     max_age_seconds: 300
#
# External URL checks are disabled by default to avoid surprise network calls.
# To intentionally check an outside URL, set allow_external: true on that check.
#   - name: Public status endpoint
#     type: url
#     url: https://example.com/health
#     expected_status: 200
#     allow_external: true

# Security Pulse local review
# Security Pulse reads local visibility signals only.
# Linux keeps the deeper v0.3 collector.
# macOS baseline signals include SSH key hygiene, Docker CLI visibility,
# application firewall visibility, FileVault visibility, and SIP visibility.
# Windows baseline signals include SSH key hygiene, Docker CLI visibility,
# Windows Firewall visibility, Defender visibility, and BitLocker visibility.
# It does not change firewall rules, SSH settings, users, groups, services,
# Fail2Ban state, Docker permissions, container settings, or system settings.
# Some checks may show UNKNOWN when logs or tools are not readable without sudo/admin rights.
# Normal laptop/Desktop signals should stay calm: a Docker socket can be normal
# on a Docker host, a few active terminal sessions can be normal, and missing
# Fail2Ban can be normal when another protection layer is used.
# v0.2 added more orientation signals without exposing sensitive content:
# - reboot-required marker
# - firewall tool visibility
# - SSH config basic flags only, no file contents
# - Docker group member count only, no names
# - basic sensitive file permission sanity checks, no file contents
# v0.3 adds further local safety orientation:
# - running Docker container audit for privileged/host/Docker-socket patterns
# - current-user SSH key permission hygiene, no key names or contents
# - AppArmor/SELinux visibility
# - failed systemd unit count, no unit names
security_command_timeout_seconds: 1.5
security_auth_log_max_lines: 600
security_failed_login_warn_count: 5
security_failed_login_critical_count: 20
security_session_warn_count: 4
security_session_critical_count: 10
security_docker_group_warn_count: 4
security_docker_inspect_max_containers: 30
security_systemd_failed_warn_count: 1
security_systemd_failed_critical_count: 5
security_check_docker_socket: true
security_check_auth_log: true
security_check_fail2ban: true
security_check_sessions: true
security_check_reboot_required: true
security_check_firewall_visibility: true
security_check_ssh_config: true
security_check_docker_group: true
security_check_sensitive_file_permissions: true
security_check_docker_container_audit: true
security_check_ssh_key_hygiene: true
security_check_lsm_visibility: true
security_check_systemd_failed_units: true

# optional multi-host setup
# leave hosts unset or empty to keep the normal single-host behavior
# hosts:
#   - name: local
#     docker_context: default

container_overrides:
  postgres:
    memory_warn_mb: 2048
  redis:
    memory_warn_mb: 512
  my_busy_worker:
    cpu_warn_percent: 70
