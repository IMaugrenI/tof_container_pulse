name: Pulse Suite smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python and platform
        run: python --version

      - name: Run cross-platform smoke check
        run: python scripts/smoke_check.py

      - name: Upload generated HTML on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-html-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            pulse.html
            hardware.html
            ports.html
            storage.html
            services.html
            security.html
          if-no-files-found: ignore
